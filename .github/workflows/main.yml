name: Build Viyzo APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check source files
        run: |
          test -f MainActivity.java
          test -f google-services.json

      - name: Create Viyzo Android project
        run: |
          rm -rf project

          mkdir -p project/app/src/main/java/com/viyzo/app
          mkdir -p project/app/src/main/res/values

          cp MainActivity.java \
            project/app/src/main/java/com/viyzo/app/MainActivity.java

          cp google-services.json \
            project/app/google-services.json

          cat > project/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Viyzo"
          include(":app")
          EOF

          cat > project/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
              id 'com.google.gms.google-services' version '4.4.2' apply false
          }
          EOF

          cat > project/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > project/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'com.google.gms.google-services'
          }

          android {
              namespace 'com.viyzo.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.viyzo.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.activity:activity:1.10.1'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.core:core:1.15.0'

              implementation platform('com.google.firebase:firebase-bom:33.7.0')
              implementation 'com.google.firebase:firebase-auth'
              implementation 'com.google.firebase:firebase-firestore'
          }
          EOF

          cat > project/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme"
                  parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowLightNavigationBar">false</item>
              </style>
          </resources>
          EOF

          cat > project/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:label="Viyzo"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      - name: Verify project
        run: |
          test -f project/settings.gradle
          test -f project/build.gradle
          test -f project/app/build.gradle
          test -f project/app/google-services.json
          test -f project/app/src/main/AndroidManifest.xml
          test -f project/app/src/main/java/com/viyzo/app/MainActivity.java

          grep -q '^package com\.viyzo\.app;' \
            project/app/src/main/java/com/viyzo/app/MainActivity.java

          echo "Viyzo project verified successfully."

      - name: Build Viyzo APK
        run: |
          cd project
          gradle clean :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Upload Viyzo APK
        uses: actions/upload-artifact@v4
        with:
          name: Viyzo-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

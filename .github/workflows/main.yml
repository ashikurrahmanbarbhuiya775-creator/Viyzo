name: Build Viyzo APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Viyzo starter
        run: |
          rm -rf project
          mkdir -p project
          unzip -q Viyzo-Android-Starter.zip -d project

      - name: Find project
        run: |
          PROJECT_DIR=$(find project -name settings.gradle -type f -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Write settings.gradle
        run: |
          cat > "$PROJECT_DIR/settings.gradle" <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Viyzo"
          include(":app")
          EOF

      - name: Write root build.gradle
        run: |
          cat > "$PROJECT_DIR/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
              id 'com.google.gms.google-services' version '4.4.2' apply false
          }
          EOF

      - name: Write app build.gradle
        run: |
          cat > "$PROJECT_DIR/app/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application'
              id 'com.google.gms.google-services'
          }

          android {
              namespace 'com.viyzo.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.viyzo.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'

              implementation platform('com.google.firebase:firebase-bom:33.7.0')
              implementation 'com.google.firebase:firebase-auth'
              implementation 'com.google.firebase:firebase-firestore'
          }
          EOF

      - name: Write AppCompat theme
        run: |
          mkdir -p "$PROJECT_DIR/app/src/main/res/values"

          cat > "$PROJECT_DIR/app/src/main/res/values/styles.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:statusBarColor">#141418</item>
                  <item name="android:navigationBarColor">#141418</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowLightNavigationBar">false</item>
              </style>

          </resources>
          EOF

      - name: Write AndroidManifest
        run: |
          cat > "$PROJECT_DIR/app/src/main/AndroidManifest.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="Viyzo"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      - name: Copy MainActivity
        run: |
          TARGET="$PROJECT_DIR/app/src/main/java/com/viyzo/app/MainActivity.java"

          if [ ! -f MainActivity.java ]; then
            echo "MainActivity.java not found in repository"
            exit 1
          fi

          mkdir -p "$(dirname "$TARGET")"
          cp MainActivity.java "$TARGET"

      - name: Copy Firebase config
        run: |
          if [ ! -f google-services.json ]; then
            echo "google-services.json not found"
            exit 1
          fi

          cp google-services.json "$PROJECT_DIR/app/google-services.json"

      - name: Show important files
        run: |
          echo "===== settings.gradle ====="
          cat "$PROJECT_DIR/settings.gradle"

          echo "===== app/build.gradle ====="
          cat "$PROJECT_DIR/app/build.gradle"

          echo "===== Firebase file ====="
          ls -lh "$PROJECT_DIR/app/google-services.json"

          echo "===== MainActivity ====="
          ls -lh "$PROJECT_DIR/app/src/main/java/com/viyzo/app/MainActivity.java"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --version
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Viyzo-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

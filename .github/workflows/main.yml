name: Build Viyzo APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Extract Viyzo project
        run: |
          mkdir project
          unzip -q Viyzo-Android-Starter.zip -d project

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find project -name settings.gradle -type f -print -quit | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Copy MainActivity.java
        run: |
          TARGET=$(find "$PROJECT_DIR" -path '*/src/main/java/com/viyzo/app/MainActivity.java' -print -quit)
          cp MainActivity.java "$TARGE
  - name: Add Firebase config
  run: |
    cp google-services.json "$PROJECT_DIR/app/google-services.json"
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Viyzo-APK
          path: |
            ${{ env.PROJECT_DIR }}/**/*.apk

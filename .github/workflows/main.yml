name: Build Viyzo APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Extract Viyzo project
        run: |
          mkdir project
          unzip -q Viyzo-Android-Starter.zip -d project

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find project -name settings.gradle -type f -print -quit | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configure Firebase
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          project = Path(os.environ["PROJECT_DIR"])

          root = project / "build.gradle"
          text = root.read_text()

          if "com.google.gms:google-services:4.5.0" not in text:
              text = """buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.google.gms:google-services:4.5.0'
              }
          }

          """ + text

          root.write_text(text)

          app = project / "app/build.gradle"
          text = app.read_text()

          if "apply plugin: 'com.google.gms.google-services'" not in text:
              text += "\napply plugin: 'com.google.gms.google-services'\n"

          if "firebase-bom" not in text:
              text = text.replace(
                  "dependencies {",
                  """dependencies {
              implementation platform('com.google.firebase:firebase-bom:34.18.0')
              implementation 'com.google.firebase:firebase-auth'
              implementation 'com.google.firebase:firebase-firestore'""",
                  1
              )

          app.write_text(text)
          PY

      - name: Copy MainActivity.java
        run: |
          TARGET=$(find "$PROJECT_DIR" -path '*/src/main/java/com/viyzo/app/MainActivity.java' -print -quit)
          cp MainActivity.java "$TARGET"

      - name: Add Firebase config
        run: |
          cp google-services.json "$PROJECT_DIR/app/google-services.json"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Viyzo-APK
          path: ${{ env.PROJECT_DIR }}/**/*.apk
